spring:
  application:
    name: peopledesk
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/peopledesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:peopledesk}
    password: ${DB_PASSWORD:peopledesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Base64 or plain text secret of at least 32 bytes. When empty, a random key is generated
    # at startup (tokens then stop working after a restart). Always set JWT_SECRET in production.
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 8h
    remember-me-refresh-token-ttl: 7d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  reports:
    max-export-rows: 10000
